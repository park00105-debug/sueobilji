<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수업일지</title>
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  html,body{margin:0;height:100%;background:#fff}
  /* 구글 안내줄(약 44px)이 화면 밖으로 나가도록 앱을 위로 올려요. 줄이 남으면 숫자를 키우고, 앱 윗부분이 잘리면 줄여요 */
  :root{--hide:44px}
  iframe{position:fixed;left:0;top:calc(var(--hide) * -1);width:100%;height:calc(100% + var(--hide));border:0}
</style>
</head>
<body>
<!-- 아래 주소를 대표님의 웹앱 배포 주소(…/exec)로 바꿔요 -->
<iframe id="app" allow="web-share; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyEPXcAKFyeW0ulf6aGmtH-2WIJCX08wuqKyQuZm5QAfAIV_6jMKrwRQ8mQfKlIPGb3/exec';
  document.getElementById('app').src = APP_URL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
